# Render Blueprint. All data lives in Postgres (migrations run on boot). Rate limits are per instance,
# so start with a single instance.
services:
  - type: web
    name: ralo
    runtime: node
    region: frankfurt
    plan: starter
    numInstances: 1
    # Dev dependencies (vite plugins, esbuild, typescript) are needed to build
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Europe/Istanbul
      - key: DEMO_MODE
        value: "false"
      - key: VITE_DEMO_MODE
        value: "false"
      - key: MAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      # Key for the email HMAC kept in consent records; generated once, never change it afterwards
      - key: CONSENT_HMAC_KEY
        generateValue: true
      # Secrets: set these in the Render dashboard
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_CA
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: APP_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Web push keys: generate once with `npx web-push generate-vapid-keys`; never change them afterwards
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Bank account shown to clubs on their monthly statements
      - key: PAYMENT_IBAN
        sync: false
      - key: PAYMENT_ACCOUNT_NAME
        sync: false
