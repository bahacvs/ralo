name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type check, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version that produced bun.lock, so --frozen-lockfile stays stable
          bun-version: 1.4.0

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: node node_modules/typescript/bin/tsc --noEmit

      # The runner is deliberately on UTC: server/time.ts must pin the process
      # to Europe/Istanbul, and test 4.x fails if that pinning breaks.
      - name: Server tests (TZ=UTC)
        run: npx tsx server/tests.ts
        env:
          TZ: UTC

      # Applies every migration to an in-process PGlite database and checks the constraints
      - name: Database schema tests
        run: npx tsx server/db/schema.test.ts
        env:
          TZ: UTC

      - name: Backup and restore tests
        run: npx tsx server/db/backup.test.ts
        env:
          TZ: UTC

      - name: Build
        run: npm run build
        env:
          VITE_DEMO_MODE: "false"

  postgres:
    name: Tests on Postgres (ralo_app role, concurrent requests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Supabase runs Postgres 17
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ralo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Same suite against a real server: migrations as the owner, the API as ralo_app (RLS and grants apply),
      # and simultaneous bookings, joins, enrollments and cancellations really race (test 19)
      - name: Server tests on Postgres (TZ=UTC)
        run: npx tsx server/tests.ts
        env:
          TZ: UTC
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ralo_test

      - name: Backup and restore tests on Postgres
        run: npx tsx server/db/backup.test.ts
        env:
          TZ: UTC
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ralo_test

      # The operator commands themselves: back up the database the suite above filled, restore it into an empty one
      - name: db:backup and db:restore commands
        shell: bash
        env:
          DATABASE_MIGRATION_URL: postgresql://postgres:postgres@localhost:5432/ralo_test
          RESTORE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ralo_restore
          BACKUP_PASSPHRASE: ci-only-throwaway-passphrase
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c 'CREATE DATABASE ralo_restore'
          npx tsx scripts/db-backup.ts "$RUNNER_TEMP/backups" | tee "$RUNNER_TEMP/backup.log"
          npx tsx scripts/db-restore.ts "$RUNNER_TEMP"/backups/*.ralobk | tee "$RUNNER_TEMP/restore.log"
          test "$(grep '^Users:' "$RUNNER_TEMP/backup.log")" = "$(grep '^Users:' "$RUNNER_TEMP/restore.log")"
